name: kenya-recover

# Temporary recovery workflow (remove once Kenya is fully re-seeded).
#
# The Kenya PV data-fault fix (auto-resolve + T1.1 gate) landed during a
# persistent PVGIS regional 500 outage, so a batch of Kenya cells are masked
# (wind-only) or failed pending real SARAH3 data. This workflow watches for
# PVGIS to recover and then does a clean forced re-seed of Kenya at res 2/3/4.
# SEED_FORCE reprocesses ready cells; cells whose PV is already cached are cache
# hits (no PVGIS call), so once recovered this converges to near-no-op.
#
# Gated on a canary health probe so it never hammers PVGIS while it is down.

on:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours, offset from hex-seed
  workflow_dispatch:

concurrency:
  group: kenya-recover
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe PVGIS health
        id: health
        run: npx tsx scripts/hex/pvgis-health.ts
      - name: Re-seed Kenya res 2 (only when PVGIS is healthy)
        if: steps.health.outputs.healthy == 'true'
        run: npm run hex:seed -- --country Kenya 2
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEED_FORCE: "1"
      - name: Re-seed Kenya res 3
        if: steps.health.outputs.healthy == 'true'
        run: npm run hex:seed -- --country Kenya 3
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEED_FORCE: "1"
      - name: Re-seed Kenya res 4
        if: steps.health.outputs.healthy == 'true'
        run: npm run hex:seed -- --country Kenya 4
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEED_FORCE: "1"
