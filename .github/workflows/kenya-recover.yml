name: kenya-recover

# Temporary recovery workflow (remove once Kenya is fully re-seeded).
#
# The Kenya PV data-fault fix (auto-resolve + T1.1 gate) landed during an
# intermittent PVGIS regional 500 outage, so a batch of Kenya cells lack solar
# (masked wind-only, or failed) pending real SARAH3 data. This workflow watches
# for PVGIS to be broadly up, then runs a TARGETED recovery that only reprocesses
# cells lacking solar — so it can only upgrade them, never degrade a cell that
# already has good solar (which a blunt SEED_FORCE re-seed does when PVGIS is
# flaky). Converges to no-op once every servable cell has solar.
#
# Gated on a 6/8-canary health probe so it never grinds while PVGIS is down.

on:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours, offset from hex-seed
  workflow_dispatch:

concurrency:
  group: kenya-recover
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    # Hard backstop only — the recovery step is time-boxed to SEED_MINUTES (40)
    # below, so the job exits on its own with ~8 min of headroom for npm ci +
    # the health probe. A killed run loses nothing (each cell commits
    # independently; only NULL-solar cells are touched) and the next run
    # resumes on the remainder.
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe PVGIS health
        id: health
        run: npx tsx scripts/hex/pvgis-health.ts
      - name: Recover Kenya solar (targeted — only cells lacking solar, time-boxed)
        if: steps.health.outputs.healthy == 'true'
        run: npm run hex:recover-solar
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEED_MINUTES: "40"
