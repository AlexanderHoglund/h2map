name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # The corridor golden gate (build-plan Phase 0). Redundant with the
      # workspace test fan-out above, but a named step so an Excel-reproduction
      # failure is visible as its own line, per the plan's `test:golden` gate.
      - run: npm run test:golden
      # Sensitivity drift gate (build-plan 1.7): fails when the model's
      # top-level input set (≥5% headline movement) no longer matches the
      # committed ui-manifest — the interface must track the model.
      - run: npx tsx scripts/corridor/sensitivity.ts --check
      # Elasticity drift gate. Regenerate-and-diff, like the docs gate:
      # the artifact is a pure function of the engine, the bundle and the
      # archetypes, so any engine change that moves leverage must be
      # committed rather than discovered later. The full run is ~2s.
      - run: npx tsx scripts/corridor/elasticity.ts && git diff --exit-code data/corridor-sensitivity/elasticity.json
      # Generated docs must track the code (build-plan 4.3).
      - run: npx tsx scripts/corridor/gen-docs.ts && git diff --exit-code docs/corridor

  # Full-app golden (build-plan 4.4): Playwright drives the default corridor
  # scenario through the real UI and asserts the workbook's headline numbers,
  # with an axe-core serious/critical pass on every step. The corridor golden
  # path is fully client-side, so dummy Supabase env suffices.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w web
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
