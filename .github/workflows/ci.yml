name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # The corridor golden gate (build-plan Phase 0). Redundant with the
      # workspace test fan-out above, but a named step so an Excel-reproduction
      # failure is visible as its own line, per the plan's `test:golden` gate.
      - run: npm run test:golden
